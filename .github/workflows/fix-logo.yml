name: Restore and refine Teflix logo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-logo.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full site and refine logo
        run: |
          git fetch origin a4aecb833772137da15e75c0f22665b5f00d516a
          git show a4aecb833772137da15e75c0f22665b5f00d516a:index.html > index.html
          python - <<'PY'
          p='index.html'
          s=open(p).read()
          a=s.index('.logo-i{')
          b=s.index('\n.logo-frame',a)
          new='.logo-i{color:#fff;font-weight:900;font-family:Arial Black,Arial,system-ui,sans-serif;font-style:italic}.logo-x{display:inline-block;color:#0b3fbd;font-family:Arial Black,Arial,system-ui,sans-serif;font-style:italic;font-weight:900;margin-left:2px;line-height:1;letter-spacing:-.03em;text-shadow:0 0 7px #0b3fbd33}'
          s=s[:a]+new+s[b:]
          s=s.replace('<span class="logo-efli">efl<span class="logo-i">ı</span></span><span class="logo-x" aria-hidden="true"><svg viewBox="0 0 42 36" preserveAspectRatio="none"><path d="M3 4 L38 32"></path><path d="M34 4 L3 32"></path></svg></span>', '<span class="logo-efli">efli</span><span class="logo-x" aria-hidden="true">x</span>')
          s=s.replace('.logo-x{width:34px;height:31px;flex-basis:34px}', '.logo-x{width:auto;height:auto;flex-basis:auto}')
          open(p,'w').write(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore full Teflix site and refine logo' || exit 0
          git push origin main
      - name: Remove helper workflow
        run: |
          git rm .github/workflows/fix-logo.yml
          git commit -m 'Remove logo fix workflow'
          git push origin main
