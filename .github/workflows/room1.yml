name: Teflix Room 1 Branding
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/room1.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Room 1 branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old_css='''.logo{color:#fff;font-size:1.7rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:5px;letter-spacing:-.02em}\n.logo-word{display:inline-flex;align-items:center;gap:0}.logo b{color:var(--red)}\n.logo-mark{width:42px;height:32px;border-radius:10px;background:#ff1018;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 22px #ff10182b}\n.logo-mark span{width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid #fff;margin-left:3px}'''
          new_css='''.logo{color:#fff;font-size:1.7rem;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:0;letter-spacing:-.045em}\n.logo-word{display:inline-flex;align-items:center;gap:0;font-family:Arial,system-ui,sans-serif;font-style:italic;line-height:1}\n.logo-t{color:transparent;-webkit-text-stroke:2px var(--red);text-shadow:none;font-weight:1000;margin-right:1px}\n.logo-efli{color:#fff;font-weight:900}\n.logo-i{color:#fff;position:relative;font-weight:900}.logo-i:before{content:"";position:absolute;left:50%;top:-.08em;transform:translateX(-50%);width:.24em;height:.24em;border:1.5px solid var(--red);border-radius:50%}.logo-x{color:#168cff;font-weight:1000;margin-left:-.01em}'''
          old_markup='<span class="logo-mark"><span></span></span><span class="logo-word"><b>T</b>eflix</span>'
          new_markup='<span class="logo-word" aria-label="Teflix"><span class="logo-t">T</span><span class="logo-efli">efl<span class="logo-i">i</span></span><span class="logo-x">x</span></span>'
          if old_css not in s: raise SystemExit('Expected original logo CSS not found')
          if old_markup not in s: raise SystemExit('Expected original logo markup not found')
          s=s.replace(old_css,new_css).replace(old_markup,new_markup)
          s=s.replace('Made by <strong>The T</strong> <span>•</span> The Tech Cat','MADE BY <strong>TEO</strong> <span>•</span> THE TECH CAT')
          p.write_text(s)
          PY
      - name: Commit Room 1
        run: |
          git config user.name 'Teflix Holy Knight'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Teflix Room 1: official branding and creator credit'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/room1.yml
          git add .github/workflows/room1.yml
          git commit -m 'Remove temporary Room 1 workflow'
          git push
