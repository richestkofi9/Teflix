</style>

function card(key){const d=items[key];return `<article class="card" data-key="${key}" onclick="showItem('${key}')"><div class="card-thumb">${posterFiles[key]?`<img src="${posterFiles[key]}" alt="${d[0]}">`:`<span class="icon-main">${d[3]}</span>`}</div><div class="card-info"><div class="card-name">${d[0]}</div><div class="card-meta">${d[1]}</div></div></article>`}

function showItem(key){const d=items[key];if(!d)return;document.getElementById('bigTitle').textContent=d[0];document.getElementById('bigMeta').textContent=d[1];document.getElementById('bigStory').textContent=d[2];const icon=document.getElementById('bigIcon');if(posterFiles[key]){icon.innerHTML=`<img src="${posterFiles[key]}" alt="${d[0]}">`}else{icon.textContent=d[3]}document.getElementById('detailOverlay').style.display='block';document.body.style.overflow='hidden';if(location.hash!=='#details')history.pushState({details:true},'', '#details')}
function closeItem(){document.getElementById('detailOverlay').style.display='none';document.body.style.overflow='';if(location.hash==='#details')history.back()}
function watchItem(){alert('🎬 Play feature coming soon!')}

function searchTitles(){const q=document.getElementById('searchInput').value.toLowerCase().trim();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.querySelector('.card-name').textContent.toLowerCase().includes(q)?'':'none'})}
function filterLetter(letter){document.getElementById('searchInput').value='';document.querySelectorAll('.card').forEach(c=>{const t=c.querySelector('.card-name').textContent.trim().toUpperCase();c.style.display=(letter==='all'||t.startsWith(letter))?'':'none'})}
window.addEventListener('popstate',()=>{const o=document.getElementById('detailOverlay');if(o.style.display==='block'){o.style.display='none';document.body.style.overflow=''}});
